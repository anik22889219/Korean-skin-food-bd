name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting (via Service Account)
        if: "${{ env.HAS_SA == 'true' }}"
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: gen-lang-client-0633897500
        env:
          HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_TOKEN == '' }}

      - name: Deploy to Firebase Hosting (via Firebase CLI Token)
        if: "${{ env.HAS_TOKEN == 'true' }}"
        run: npx -y firebase-tools deploy --only hosting --project gen-lang-client-0633897500 --token "${{ secrets.FIREBASE_TOKEN }}"
        env:
          HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
