name: Deploy to Firebase Hosting on Push

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Deploy to Firebase Hosting (via Service Account)
        uses: FirebaseExtended/action-hosting-deploy@v0
        if: "${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0633897500 != '' }}"
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0633897500 }}'
          channelId: live
          projectId: gen-lang-client-0633897500

      - name: Deploy to Firebase Hosting (via CI Token Fallback)
        if: "${{ (secrets.FIREBASE_SERVICE_ACCOUNT == '' && secrets.FIREBASE_SERVICE_ACCOUNT_GEN_LANG_CLIENT_0633897500 == '') && secrets.FIREBASE_TOKEN != '' }}"
        run: npx -y firebase-tools deploy --only hosting --project gen-lang-client-0633897500 --token "${{ secrets.FIREBASE_TOKEN }}"
